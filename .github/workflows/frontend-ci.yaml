name: frontend-ci

on:
  push:
    branches: [main]
    paths: ['src/frontend/**', '.github/workflows/frontend-ci.yaml']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/salikahmed49/frontend
  ORIG_IMAGE: us-central1-docker.pkg.dev/google-samples/microservices-demo/frontend

jobs:
  build-scan-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set image tag to short commit SHA
        run: echo "TAG=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - name: Build image (local only)
        uses: docker/build-push-action@v6
        with:
          context: src/frontend
          load: true
          tags: ${{ env.IMAGE }}:${{ env.TAG }}

      - name: Scan with Trivy (fail on CRITICAL)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ env.TAG }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        run: docker push ${{ env.IMAGE }}:${{ env.TAG }}

      - name: Update image tag in app-config
        run: |
          git clone https://x-access-token:${{ secrets.CONFIG_REPO_TOKEN }}@github.com/salikahmed49/app-config.git
          cd app-config/overlays/dev
          kustomize edit set image ${{ env.ORIG_IMAGE }}=${{ env.IMAGE }}:${{ env.TAG }}
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add .
          git commit -m "ci: frontend image ${{ env.TAG }}"
          git push
